<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>연수 종료</title>
<style>
  :root { --bg: #eef2f8; --card: #ffffff; --ink: #1d2233; --sub: #5b6476; --blue: #1e73e8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121722; --card: #1c2333; --ink: #e8ecf5; --sub: #a3acc0; --blue: #6aa5ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; padding: 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 32px 28px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(20, 40, 90, .12); border-top: 6px solid var(--blue); }
  h1 { font-size: 1.35em; margin: 0 0 12px; }
  p { margin: 0 0 8px; line-height: 1.7; color: var(--sub); }
</style>
</head>
<body>
  <div class="card">
    <h1>연수가 끝나 사이트를 닫았습니다</h1>
    <p>AI 논·서술형 평가 연수(2026. 10. 17.) 실습 사이트는<br>보안을 위해 연수 시간에만 공개했습니다.</p>
    <p>참여해 주셔서 감사합니다.</p>
  </div>
</body>
</html>
